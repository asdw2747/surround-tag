[package]
name = "surround-tag"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
authors = ["Prisma Chill"]
license = "MIT"
description = "Tag and embed cover art in 5.1 Matroska audio without re-encoding."
readme = "README.md"
repository = "https://github.com/asdw2747/surround-tag"
homepage = "https://github.com/asdw2747/surround-tag"
keywords = ["matroska", "surround", "audio", "metadata", "mkvtoolnix"]
categories = ["multimedia::audio", "gui"]

[lib]
name = "surround_tag"
path = "src/lib.rs"

[[bin]]
name = "surround-tag"
path = "src/main.rs"

[dependencies]
dirs = "6"
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
lofty = "0.25.5"
open = "5"
quick-xml = "0.41.0"
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11.1"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
walkdir = "2.5.1"
which = "8.0.6"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
